# Testing the Medusa wallet's onboarding flow.
#
#   npx sitometres run examples/medusa_wallet.yaml --no-setup
#
# --no-setup is load-bearing, not tidiness. profiles/medusa_ui.yaml is picked
# up automatically for medusa_ui and walks this same onboarding, so without the
# flag the wallet is created AND unlocked before step 1 runs, and the spec fails
# asking for a screen it drove past itself.
#
# Nothing else to set up: sitometres gives the app a throwaway $HOME and
# medusa_core resolves its wallet under $HOME, so a run starts with no wallet
# and medusa_ui opens on "Create your wallet", which is what this spec drives.
# --real-home is no use here - your real wallet already exists, so the app opens
# on the unlock screen and step 1 fails. Unlock that one with
# --wallet-password and test something behind the gate instead.

app: medusa_ui
with: [medusa_core]
timeout: 60s

# medusa_ui polls this every 800ms - it is over half of all call traffic.
ignore_calls:
  - "medusa_core.pendingRequests"
  - "medusa_core.getJob"

steps:
  - name: the wallet opens on the create-wallet screen
    open: medusa_ui
    expect:
      text:
        - "Create your wallet"
        - "Create wallet"
      # The backend is reachable and reported its state.
      calls: ["medusa_core.getWalletState"]

  - name: typing a password enables the create button
    type:
      into: { type: "Pre64TextInput", nth: 0 }
      text: "sitometres-test-passphrase"

  - name: confirming it matches
    type:
      into: { type: "Pre64TextInput", nth: 1 }
      text: "sitometres-test-passphrase"

  - name: creating the wallet reaches the backend and shows the recovery phrase
    click: "Create wallet"
    timeout: 90s
    expect:
      calls: ["medusa_core.createEncryptedWallet"]
      calls_succeed: true
    # The recovery phrase screen can take a while to render.

  # Be specific. "recovery" as a substring also matches the blurb on the create
  # screen ("you'll see your recovery phrase next"), so a loose assertion here
  # passes without the app having moved at all.
  - name: the backup screen is presented
    wait_for:
      text: ["Back up your recovery phrase"]
    timeout: 90s
